name: Denial ARM64 build

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show architecture
        run: uname -m

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig1-dev libdrm-dev libgbm-dev \
            libegl-dev libinput-dev libseat-dev libudev-dev \
            libxkbcommon-dev libpam0g-dev rtkit xwayland

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Compositor (deniald & denialctl)
        run: |
          cd compositor
          cargo build --release --locked --features flutter --bin deniald --bin denialctl
          mkdir -p /tmp/denial-output/bin
          cp target/release/deniald target/release/denialctl /tmp/denial-output/bin/

      - name: Upload ARM64 Binaries
        uses: actions/upload-artifact@v4
        with:
          name: denial-aarch64-v0.3.1-bin
          path: /tmp/denial-output/
